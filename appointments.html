<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmileCare | Appointments</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="brand">
      <span class="tooth">◉</span>
      <span class="brand-text">SmileCare<small>Dental Practice Manager</small></span>
    </div>
    <a href="dashboard.html" class="nav"><span class="ico">⌂</span><span class="nav-label">Dashboard</span></a>
    <a href="appointments.html" class="nav active"><span class="ico">▦</span><span class="nav-label">Appointments</span></a>
    <a href="patients.html" class="nav"><span class="ico">▱</span><span class="nav-label">Patient Records</span></a>
    <a href="progress.html" class="nav"><span class="ico">▥</span><span class="nav-label">Progress Tracking</span></a>
    <a href="search.html" class="nav"><span class="ico">⌕</span><span class="nav-label">Search & Filter</span></a>
    <a href="settings.html" class="nav"><span class="ico">⚙</span><span class="nav-label">Settings</span></a>
    <a href="profile.html" class="nav" style="margin-top:12px"><span class="ico">♙</span><span class="nav-label">Profile</span></a>
    <a href="index.html" class="nav" id="logoutBtn"><span class="ico">⇥</span><span class="nav-label">Log Out</span></a>
    
    <div class="side-bottom">
      <div style="font-size:31px;margin-bottom:9px">🦷</div>
      <b>Healthy Smiles.</b>Happier Lives.
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="main">
    <!-- Topbar Header -->
    <header class="topbar">
      <div class="global-search">
        <span>⌕</span>
        <input id="globalSearch" placeholder="Search patients, records, or appointments...">
      </div>
      <div class="top-user">
        <span style="font-size:20px">♧</span>
        <div class="avatar" id="topAvatar">JD</div>
        <div class="user-text">
          <b id="topName">Dr. Johnson</b>
          <div id="topRole">Admin</div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <div class="content">
      <div class="page-title">
        <h1>Appointments</h1>
        <button id="addAppointmentBtn">＋ Schedule appointment</button>
      </div>

      <!-- Filters Row -->
      <div class="filters">
        <input id="appointmentSearch" placeholder="Search patient or treatment...">
        <select id="appointmentStatus">
          <option value="">All statuses</option>
          <option>Confirmed</option>
          <option>Pending</option>
          <option>Completed</option>
          <option>Cancelled</option>
        </select>
        <input id="appointmentDateFilter" type="date">
      </div>

      <!-- Appointments Table Panel -->
      <div class="panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Patient</th>
                <th>Treatment</th>
                <th>Provider</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="appointmentRows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal Dialog -->
<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Schedule appointment</h2>
      <button class="close" id="modalClose">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Scripts -->
<script src="script.js"></script>
<script>
  // 1. Render Appointments Table with Filters
  function renderAppointments() {
    const q = (document.getElementById("appointmentSearch")?.value || "").toLowerCase();
    const st = document.getElementById("appointmentStatus")?.value || "";
    const dt = document.getElementById("appointmentDateFilter")?.value || "";

    const appointments = getAppointments();
    const filtered = appointments.filter(a => {
      const pName = getPatientName(a.patientId);
      const textMatch = (pName + " " + a.treatment + " " + a.provider).toLowerCase().includes(q);
      const statusMatch = !st || a.status === st;
      const dateMatch = !dt || a.date === dt;
      return textMatch && statusMatch && dateMatch;
    }).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

    const tbody = document.getElementById("appointmentRows");
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="7" class="empty">No matching appointments.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(a => `
      <tr>
        <td>${formatDate(a.date)}</td>
        <td>${formatTime(a.time)}</td>
        <td>${escapeHtml(getPatientName(a.patientId))}</td>
        <td>${escapeHtml(a.treatment)}</td>
        <td>${escapeHtml(a.provider)}</td>
        <td>
          <select aria-label="Appointment status" onchange="changeStatus(${a.id}, this.value)">
            ${["Confirmed", "Pending", "Completed", "Cancelled"].map(s => `
              <option ${a.status === s ? "selected" : ""}>${s}</option>
            `).join("")}
          </select>
        </td>
        <td>
          <button class="view" onclick="viewAppointment(${a.id})">View</button>
          <button class="view" onclick="openAppointmentModal(${a.id})">Edit</button>
        </td>
      </tr>
    `).join("");
  }

  // 2. Inline Status Change
  function changeStatus(id, newStatus) {
    const list = getAppointments();
    const appt = list.find(x => x.id === id);
    if (appt) {
      appt.status = newStatus;
      saveAppointments(list);
      logActivity("Appointment status changed to " + newStatus + " for " + getPatientName(appt.patientId));
      renderAppointments();
      showToast("Appointment status updated.");
    }
  }

  // 3. View Appointment Details Modal
  function viewAppointment(id) {
    const appt = getAppointments().find(x => x.id === id);
    if (!appt) return;

    openModal("Appointment details", `
      <p><b>Patient:</b> ${escapeHtml(getPatientName(appt.patientId))}</p>
      <p><b>Date:</b> ${formatDate(appt.date)} at ${formatTime(appt.time)}</p>
      <p><b>Treatment:</b> ${escapeHtml(appt.treatment)}</p>
      <p><b>Provider:</b> ${escapeHtml(appt.provider)}</p>
      <p><b>Status:</b> ${escapeHtml(appt.status)}</p>
      <div class="form-actions">
        <button type="button" onclick="openAppointmentModal(${appt.id})">Edit appointment</button>
        <button type="button" class="secondary" onclick="closeModal()">Close</button>
      </div>
    `);
  }

  // 4. Schedule or Edit Appointment Modal
  function openAppointmentModal(editId = null) {
    const appointments = getAppointments();
    const appt = editId ? appointments.find(x => x.id === editId) : null;
    const todayStr = new Date().toISOString().slice(0, 10);
    const treatments = ["Cleaning", "Check-up", "Root Canal", "Filling", "Braces Consultation", "Extraction", "Whitening", "Other"];
    const statuses = ["Confirmed", "Pending", "Completed", "Cancelled"];

    openModal(appt ? "Edit appointment" : "Schedule appointment", `
      <form id="apptForm">
        <div class="form-grid">
          <div class="field full">
            <label>Patient *</label>
            <select name="patientId" required>
              ${getPatientOptions(appt ? appt.patientId : "")}
            </select>
          </div>
          <div class="field">
            <label>Date *</label>
            <input name="date" type="date" value="${appt ? appt.date : todayStr}" required>
          </div>
          <div class="field">
            <label>Time *</label>
            <input name="time" type="time" value="${appt ? appt.time : "09:00"}" required>
          </div>
          <div class="field">
            <label>Treatment *</label>
            <select name="treatment" required>
              ${treatments.map(t => `<option ${(appt?.treatment === t) ? "selected" : ""}>${t}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label>Provider *</label>
            <input name="provider" value="${escapeHtml(appt ? appt.provider : "Dr. Johnson")}" required maxlength="80">
          </div>
          <div class="field">
            <label>Status</label>
            <select name="status">
              ${statuses.map(s => `<option ${(appt ? appt.status : "Confirmed") === s ? "selected" : ""}>${s}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit">Save appointment</button>
          <button type="button" class="secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    `, function(formData) {
      const updatedData = {
        date: formData.get("date"),
        time: formData.get("time"),
        patientId: formData.get("patientId"),
        treatment: formData.get("treatment"),
        provider: formData.get("provider").trim(),
        status: formData.get("status")
      };

      const list = getAppointments();
      if (appt) {
        const item = list.find(x => x.id === editId);
        if (item) Object.assign(item, updatedData);
        logActivity("Appointment updated for " + getPatientName(updatedData.patientId));
      } else {
        list.push({ id: Date.now(), ...updatedData });
        logActivity("Appointment scheduled for " + getPatientName(updatedData.patientId));
      }

      saveAppointments(list);
      closeModal();
      renderAppointments();
      showToast("Appointment saved.");
    });
  }

  // Setup listeners
  document.addEventListener("DOMContentLoaded", function() {
    renderAppointments();

    document.getElementById("addAppointmentBtn").onclick = () => openAppointmentModal();
    document.getElementById("appointmentSearch").addEventListener("input", renderAppointments);
    document.getElementById("appointmentStatus").addEventListener("change", renderAppointments);
    document.getElementById("appointmentDateFilter").addEventListener("change", renderAppointments);
  });
</script>
</body>
</html>
