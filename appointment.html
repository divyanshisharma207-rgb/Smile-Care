<!DOCTYPE html>
<html>
<head>
    <title>GhostBusters Dental Studio - Appointment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="navbar">
        <a href="index.html" class="logo">GhostBusters Dental Studio</a>
        <div class="menu">
            <a href="index.html">Home</a>
            <a href="treatments.html">Treatments</a>
            <a href="appointment.html">Appointment</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="patients.html">Patients</a>
        </div>
    </div>

    <div class="container">
        <div class="box small-box">
            <h2>Book Patient Appointment</h2>
            
            <label>Patient Name:</label>
            <input type="text" id="pName" placeholder="Enter full name">

            <label>Phone Number:</label>
            <input type="text" id="pPhone" placeholder="Enter mobile number">

            <label>Select Treatment:</label>
            <select id="pTreatment">
                <option value="Root Canal Therapy">Root Canal Therapy</option>
                <option value="Teeth Whitening">Teeth Whitening</option>
                <option value="Dental Implants">Dental Implants</option>
                <option value="Teeth Cleaning">Teeth Cleaning</option>
            </select>

            <label>Appointment Date:</label>
            <input type="date" id="pDate">

            <label>Status:</label>
            <select id="pStatus">
                <option value="Scheduled">Scheduled</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>

            <button onclick="bookAppointment()" class="btn" style="width: 100%;">Save Appointment</button>
        </div>
    </div>

    <div class="footer">© 2026 GhostBusters Dental Studio</div>
    <script src="script.js"></script>
</body>
</html>
