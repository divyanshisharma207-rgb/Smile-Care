<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmileCare | Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login Screen -->
  <div class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <span class="tooth">◉</span> SmileCare
      </div>
      <h1>Welcome back</h1>
      <p>Sign in to your dental practice workspace.</p>

      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email address</label>
          <input id="loginEmail" type="email" value="admin@smilecare.demo" required>
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" value="SmileCare123!" required minlength="6">
        </div>

        <div class="field">
          <label for="loginRole">Demo role</label>
          <select id="loginRole">
            <option value="Admin">Administrator</option>
            <option value="Staff">Staff member</option>
          </select>
        </div>

        <button type="submit">Sign in securely</button>
      </form>

      <div class="demo-note">
        <b>Demo access</b><br>
        Admin: admin@smilecare.demo / SmileCare123!<br>
        Staff: staff@smilecare.demo / SmileCare123!<br>
        <small>Demo-only sign-in. Connect a secure backend before using real patient data.</small>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Shared Script -->
  <script src="script.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const role = document.getElementById("loginRole").value;

      if (!email.includes("@")) {
        showToast("Enter a valid email address.");
        return;
      }

      const currentUser = getCurrentUser();
      currentUser.role = role;
      currentUser.email = email;
      currentUser.name = role === "Admin" ? "Dr. Johnson" : "Clinic Staff";
      saveCurrentUser(currentUser);

      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
